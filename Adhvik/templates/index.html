<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electro Car Dash - 5-Lane Cyber 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #03051e;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Compact Header HUD */
        #hud {
            position: absolute;
            top: 8px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 800;
            pointer-events: none;
            z-index: 5;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            background: rgba(10, 20, 50, 0.8);
            padding: 6px 16px;
            border-radius: 15px;
            border: 1px solid rgba(0, 212, 255, 0.6);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        .hud-item { display: flex; align-items: center; gap: 6px; }
        .hud-val { color: #00e5ff; }
        .level-val { color: #ff007f; font-size: 18px; text-shadow: 0 0 8px #ff007f; }

        /* Compact Announcement Toast */
        #announcement {
            position: absolute;
            top: 48px;
            width: 100%;
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff00, 2px 2px 4px #000;
            z-index: 6;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            transform: scale(0.95);
        }

        #announcement.show {
            opacity: 1;
            transform: scale(1.0);
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 40, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .hidden { display: none !important; }

        .overlay h2 {
            font-size: 36px;
            margin-bottom: 12px;
            color: #00e5ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px #00e5ff, 0 0 40px #ff007f;
        }

        .overlay p { font-size: 19px; margin: 6px 0; font-weight: 600; }

        .high-score-msg {
            color: #ffff00;
            font-size: 20px !important;
            text-align: center;
            animation: pulse 0.8s infinite alternate;
            margin-bottom: 12px !important;
            text-shadow: 0 0 10px #00ff88;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }

        input[type="text"] {
            padding: 10px 18px;
            font-size: 17px;
            border-radius: 20px;
            border: 2px solid #00e5ff;
            background: rgba(0,0,0,0.6);
            color: #fff;
            outline: none;
            text-align: center;
            margin-bottom: 15px;
            width: 230px;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        button {
            padding: 10px 28px;
            font-size: 17px;
            font-weight: 800;
            background: linear-gradient(135deg, #00e5ff, #ff007f);
            color: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            transition: transform 0.15s, box-shadow 0.15s;
            margin: 8px;
            z-index: 12;
            pointer-events: auto;
        }

        button:hover {
            transform: scale(1.06);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.9);
        }

        .controls-hint {
            margin-top: 12px;
            font-size: 13px;
            color: #ccc;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- TOP HUD -->
        <div id="hud">
            <div class="hud-item">LEVEL: <span id="hud-level" class="hud-val level-val">1</span></div>
            <div class="hud-item">SCORE: <span id="hud-score" class="hud-val">0</span></div>
            <div class="hud-item">TIME: <span id="hud-time" class="hud-val">0</span>s</div>
        </div>

        <div id="announcement"></div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h2>ELECTRO CAR DASH</h2>
            <input type="text" id="player-name" placeholder="Enter Runner Name" maxlength="12">
            <button id="start-btn" type="button">START GAME</button>
            <div class="controls-hint">
                🎮 <b>Controls:</b><br>
                <b>Left/Right Arrows (A/D):</b> Switch Lanes (0 to 4) | <b>Spacebar:</b> Jump<br>
                <b>Up Arrow (W):</b> Surge Forward | <b>Down Arrow (S):</b> Slide Back
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="overlay hidden">
            <h2 style="color: #ff007f; text-shadow: 0 0 20px #ff007f;">GAME OVER</h2>
            <p id="congrats-msg" class="high-score-msg hidden">🎉 CONGRATULATIONS! 🎉<br>NEW HIGH SCORE!</p>
            <p>Your Score: <span id="final-score" style="color:#00e5ff;">0</span></p>
            <p>High Score: <span id="high-score" style="color:#ffd700;">0</span></p>
            <p>Level Reached: <span id="final-level" style="color:#ff007f;">1</span></p>
            <button id="restart-btn" type="button">PLAY AGAIN</button>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="overlay hidden">
            <h2>GAME PAUSED</h2>
            <button id="resume-btn" type="button">RESUME</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // Game State Variables
        let state = "START";
        let level = 1;
        let baseSpeed = 3.5;
        let speed = baseSpeed;
        let totalScore = 0;
        let highScore = 0;
        let frameCount = 0;
        let levelTimeSeconds = 0;
        let totalTimeSeconds = 0;
        let playerName = "Player";
        let isNewHighScore = false;

        // 5 Racing Lanes Coordinates (-320 to +320)
        const LANES_X = [-320, -160, 0, 160, 320];
        const HORIZON_Y = 0.12;
        const PLAYER_MIN_Z = 0.85;
        const PLAYER_MAX_Z = 0.45;

        let spawnedDiamondThisLevel = false;
        let spawnedAdvanceThisLevel = false;

        // Image Asset Loader
        function loadImg(filename) {
            const img = new Image();
            img.src = "/static/images/" + filename;
            return img;
        }

        const imgPlayer = loadImg("player.png");
        const imgPebble = loadImg("pebble.png");
        const imgRock = loadImg("rock.png");
        const imgBoulder = loadImg("boulder.png");
        const imgPillar = loadImg("pillar.png");

        const imgSilver = loadImg("silver.png");
        const imgGold = loadImg("gold.png");
        const imgPlatinum = loadImg("platinum.png");
        const imgDiamond = loadImg("diamond.png");
        const imgAdvance = loadImg("AdvanceMedal.png");

        let assetsLoaded = false;
        let loadedCount = 0;
        const allImages = [imgPlayer, imgPebble, imgRock, imgBoulder, imgPillar, imgSilver, imgGold, imgPlatinum, imgDiamond, imgAdvance];
        
        allImages.forEach(img => {
            img.onload = () => {
                loadedCount++;
                if (loadedCount === allImages.length) assetsLoaded = true;
            };
        });

        // Player State (Start in Middle Lane 2)
        const player = {
            lane: 2,
            targetX: 0,
            x: 0,
            z: PLAYER_MIN_Z,
            targetZ: PLAYER_MIN_Z,
            yOffset: 0,
            isJumping: false,
            yVelocity: 0,
            gravity: 0.9,
            jumpImpulse: -16,
            isSliding: false,
            slideTimer: 0,
            maxSlideTimer: 35
        };

        let obstacles = [];
        let collectibles = [];
        let particles = [];
        let roadGridOffset = 0;

        // Audio Effects Synthesizer
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { 
            if (!audioCtx) audioCtx = new AudioContext(); 
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === "jump") {
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(450, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            } else if (type === "coin") {
                osc.frequency.setValueAtTime(650, now);
                osc.frequency.setValueAtTime(1250, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            } else if (type === "bonus") {
                osc.type = "square";
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.setValueAtTime(900, now + 0.1);
                osc.frequency.setValueAtTime(1500, now + 0.2);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            } else if (type === "level") {
                osc.type = "triangle";
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(600, now + 0.15);
                osc.frequency.setValueAtTime(1200, now + 0.3);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            } else if (type === "crash") {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(130, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.35);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
            }
            osc.start(now);
            osc.stop(now + 0.5);
        }

        // Movement Controls (Supports 0 to 4 lanes)
        document.addEventListener("keydown", (e) => {
            if (state === "RUNNING") {
                if ((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && player.lane > 0) {
                    player.lane--;
                } else if ((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && player.lane < 4) {
                    player.lane++;
                }
                else if ((e.key === " " || e.key === "Spacebar") && !player.isJumping) {
                    player.isJumping = true;
                    player.yVelocity = player.jumpImpulse;
                    playSound("jump");
                }
                else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
                    player.targetZ = Math.max(PLAYER_MAX_Z, player.targetZ - 0.08);
                }
                else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") {
                    player.targetZ = Math.min(PLAYER_MIN_Z, player.targetZ + 0.08);
                    if (!player.isSliding) {
                        player.isSliding = true;
                        player.slideTimer = player.maxSlideTimer;
                    }
                }
                else if (e.key === "p" || e.key === "P") {
                    togglePause();
                }
            }
        });

        function showAnnouncement(text) {
            const el = document.getElementById("announcement");
            el.innerText = text;
            el.classList.add("show");
            setTimeout(() => { el.classList.remove("show"); }, 2000);
        }

        // Spawn Obstacles across 5 Lanes
        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 5);
            let selectedImg = imgPebble;
            let type = "pebble";
            let scale = 1.0;

            if (levelTimeSeconds < 15) {
                if (Math.random() < 0.65) { selectedImg = imgPebble; type = "pebble"; scale = 0.90; }
                else { selectedImg = imgRock; type = "rock"; scale = 1.15; }
            } else if (levelTimeSeconds < 35) {
                if (Math.random() < 0.5) { selectedImg = imgRock; type = "rock"; scale = 1.15; }
                else { selectedImg = imgBoulder; type = "boulder"; scale = 1.4; }
            } else {
                if (Math.random() < 0.4) { selectedImg = imgBoulder; type = "boulder"; scale = 1.4; }
                else { selectedImg = imgPillar; type = "pillar"; scale = 1.9; }
            }

            obstacles.push({
                lane: lane,
                z: 0.0,
                image: selectedImg,
                type: type,
                scale: scale
            });
        }

        // Spawn Collectibles across 5 Lanes
        function spawnCollectible(img, basePts, typeName, textAlert = null) {
            const lane = Math.floor(Math.random() * 5);
            const finalPts = basePts + (level - 1) * 50;

            collectibles.push({
                lane: lane,
                z: 0.0,
                image: img,
                pts: finalPts,
                type: typeName
            });

            if (textAlert) {
                showAnnouncement(`${textAlert} (+${finalPts} PTS)`);
                playSound("bonus");
            }
        }

        // Level Up Logic
        function advanceLevel() {
            level++;
            levelTimeSeconds = 0;
            spawnedDiamondThisLevel = false;
            spawnedAdvanceThisLevel = false;

            speed = baseSpeed * (1 + (level - 1) * 0.1);

            document.getElementById("hud-level").innerText = level;
            showAnnouncement(`🚀 LEVEL ${level}! SPEED & BONUS SCORES UP!`);
            playSound("level");
        }

        function createCoinShower() {
            particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * -canvas.height,
                    size: 14 + Math.random() * 14,
                    speedY: 3 + Math.random() * 5,
                    speedX: (Math.random() - 0.5) * 2,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.12
                });
            }
        }

        function update() {
            if (state === "GAMEOVER" && isNewHighScore) {
                particles.forEach(p => {
                    p.y += p.speedY;
                    p.x += p.speedX;
                    p.rotation += p.rotSpeed;
                    if (p.y > canvas.height + 20) p.y = -20;
                });
                return;
            }

            if (state !== "RUNNING") return;

            frameCount++;

            if (frameCount % 60 === 0) {
                levelTimeSeconds++;
                totalTimeSeconds++;

                totalScore += 100 + (level - 1) * 50;

                if (levelTimeSeconds % 3 === 0 && levelTimeSeconds !== 25) {
                    spawnCollectible(imgSilver, 250, "silver");
                }
                if (levelTimeSeconds % 7 === 0) {
                    spawnCollectible(imgGold, 500, "gold", "🥇 GOLD COIN!");
                }
                if (levelTimeSeconds % 11 === 0) {
                    spawnCollectible(imgPlatinum, 1000, "platinum", "🪙 PLATINUM COIN!");
                }
                if (levelTimeSeconds === 17 && !spawnedDiamondThisLevel) {
                    spawnCollectible(imgDiamond, 1500, "diamond", "💎 DIAMOND COIN!");
                    spawnedDiamondThisLevel = true;
                }
                if (levelTimeSeconds === 25 && !spawnedAdvanceThisLevel) {
                    spawnCollectible(imgAdvance, 2500, "advance", "⭐ ADVANCE MEDAL!");
                    spawnedAdvanceThisLevel = true;
                }
            }

            const spawnRate = Math.max(20, Math.floor(50 - speed * 2.0));
            if (frameCount % spawnRate === 0) {
                spawnObstacle();
            }

            player.targetX = LANES_X[player.lane];
            player.x += (player.targetX - player.x) * 0.25;
            player.z += (player.targetZ - player.z) * 0.2;

            if (player.isJumping) {
                player.yOffset += player.yVelocity;
                player.yVelocity += player.gravity;
                if (player.yOffset >= 0) {
                    player.yOffset = 0;
                    player.isJumping = false;
                }
            }

            if (player.isSliding) {
                player.slideTimer--;
                if (player.slideTimer <= 0) player.isSliding = false;
            }

            roadGridOffset = (roadGridOffset + speed * 0.006) % 1.0;

            const speedZ = speed * 0.0016;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.z += speedZ;

                const isSameLane = Math.abs(player.x - LANES_X[obs.lane]) < 45;
                const isAtSameDepth = Math.abs(obs.z - player.z) < 0.028;

                if (isSameLane && isAtSameDepth) {
                    let canJumpOver = (obs.type === "pebble" || obs.type === "rock") && player.yOffset < -35;
                    if (!canJumpOver) {
                        triggerGameOver();
                        return;
                    }
                }

                if (obs.z > 1.05) obstacles.splice(i, 1);
            }

            for (let i = collectibles.length - 1; i >= 0; i--) {
                let col = collectibles[i];
                col.z += speedZ;

                const isSameLane = Math.abs(player.x - LANES_X[col.lane]) < 50;
                const isAtSameDepth = Math.abs(col.z - player.z) < 0.045;

                if (isSameLane && isAtSameDepth) {
                    totalScore += col.pts;
                    playSound("coin");

                    if (col.type === "advance") {
                        advanceLevel();
                    }

                    collectibles.splice(i, 1);
                    continue;
                }

                if (col.z > 1.05) collectibles.splice(i, 1);
            }

            document.getElementById("hud-score").innerText = totalScore;
            document.getElementById("hud-time").innerText = totalTimeSeconds;
            document.getElementById("hud-level").innerText = level;
        }

        function project3D(x, yOffset, z) {
            const hY = canvas.height * HORIZON_Y;
            const perspective = Math.pow(z, 1.5);
            const scale = 0.12 + perspective * 0.88;

            const projX = (canvas.width / 2) + (x * scale);
            const projY = hY + ((canvas.height - hY) * perspective) + (yOffset * scale);

            return { x: projX, y: projY, scale: scale };
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * HORIZON_Y);
            skyGrad.addColorStop(0, '#03051e');
            skyGrad.addColorStop(0.45, '#0a192f');
            skyGrad.addColorStop(0.8, '#4a0072');
            skyGrad.addColorStop(1, '#ff007f');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height * HORIZON_Y);

            ctx.save();
            ctx.fillStyle = "rgba(0, 229, 255, 0.85)";
            ctx.shadowColor = "#ff007f";
            ctx.shadowBlur = 35;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height * HORIZON_Y - 25, 45, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            const trackGrad = ctx.createLinearGradient(0, canvas.height * HORIZON_Y, 0, canvas.height);
            trackGrad.addColorStop(0, '#05120a');
            trackGrad.addColorStop(1, '#010502');
            ctx.fillStyle = trackGrad;
            ctx.fillRect(0, canvas.height * HORIZON_Y, canvas.width, canvas.height - canvas.height * HORIZON_Y);

            // Render all 5 Neon Green Lanes
            for (let i = 0; i < 5; i++) {
                const p1 = project3D(LANES_X[i], 0, 0.0);
                const p2 = project3D(LANES_X[i], 0, 1.0);
                ctx.strokeStyle = "#00ff88";
                ctx.lineWidth = 2.5;
                ctx.shadowColor = "#00ff88";
                ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Outer Track Borders
            const pNearL = project3D(LANES_X[0] - 80, 0, 1.0);
            const pFarL  = project3D(LANES_X[0] - 80, 0, 0.0);
            const pNearR = project3D(LANES_X[4] + 80, 0, 1.0);
            const pFarR  = project3D(LANES_X[4] + 80, 0, 0.0);

            ctx.strokeStyle = "#00e5ff";
            ctx.lineWidth = 4;
            ctx.shadowColor = "#00e5ff";
            ctx.shadowBlur = 15;
            ctx.beginPath(); ctx.moveTo(pFarL.x, pFarL.y); ctx.lineTo(pNearL.x, pNearL.y); ctx.stroke();
            
            ctx.strokeStyle = "#ff007f";
            ctx.shadowColor = "#ff007f";
            ctx.beginPath(); ctx.moveTo(pFarR.x, pFarR.y); ctx.lineTo(pNearR.x, pNearR.y); ctx.stroke();
            ctx.shadowBlur = 0;

            // Speed Grid Lines
            for (let i = 0; i < 18; i++) {
                let gridZ = (i / 18 + roadGridOffset) % 1.0;
                if (gridZ < 0.02) continue;
                const lineL = project3D(LANES_X[0] - 80, 0, gridZ);
                const lineR = project3D(LANES_X[4] + 80, 0, gridZ);
                ctx.strokeStyle = `rgba(0, 255, 136, ${gridZ * 0.45})`;
                ctx.lineWidth = 1 + gridZ * 3;
                ctx.beginPath(); ctx.moveTo(lineL.x, lineL.y); ctx.lineTo(lineR.x, lineR.y); ctx.stroke();
            }

            let drawList = [];
            collectibles.forEach(col => drawList.push({ type: 'collectible', z: col.z, obj: col }));
            obstacles.forEach(obs => drawList.push({ type: 'obstacle', z: obs.z, obj: obs }));
            drawList.push({ type: 'player', z: player.z, obj: player });

            drawList.sort((a, b) => a.z - b.z);

            drawList.forEach(item => {
                if (item.type === 'collectible') {
                    const col = item.obj;
                    const p = project3D(LANES_X[col.lane], -35, col.z);
                    const w = 55 * p.scale;
                    const h = 55 * p.scale;

                    ctx.save();
                    ctx.shadowColor = "#00ff88";
                    ctx.shadowBlur = 25;
                    ctx.fillStyle = "rgba(0, 255, 136, 0.45)";
                    ctx.beginPath();
                    ctx.arc(p.x, p.y - h/2, w/1.4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    if (assetsLoaded) {
                        ctx.drawImage(col.image, p.x - w/2, p.y - h, w, h);
                    } else {
                        ctx.fillStyle = "#00ff88"; ctx.beginPath(); ctx.arc(p.x, p.y - h/2, w/2, 0, Math.PI*2); ctx.fill();
                    }
                } else if (item.type === 'obstacle') {
                    const obs = item.obj;
                    const p = project3D(LANES_X[obs.lane], 0, obs.z);
                    const baseW = 65 * obs.scale;
                    const baseH = 65 * obs.scale;
                    const w = baseW * p.scale;
                    const h = baseH * p.scale;

                    if (assetsLoaded) {
                        ctx.drawImage(obs.image, p.x - w/2, p.y - h, w, h);
                    } else {
                        ctx.fillStyle = "#330000"; ctx.fillRect(p.x - w/2, p.y - h, w, h);
                    }
                } else if (item.type === 'player') {
                    const p = project3D(player.x, player.yOffset, player.z);
                    let baseW = 75;
                    let baseH = 100;
                    if (player.isSliding) baseH = 55;

                    const w = baseW * p.scale;
                    const h = baseH * p.scale;

                    ctx.save();
                    ctx.shadowColor = "#00ff88";
                    ctx.shadowBlur = 20;
                    if (assetsLoaded) {
                        ctx.drawImage(imgPlayer, p.x - w/2, p.y - h, w, h);
                    } else {
                        ctx.fillStyle = "#00ff88"; ctx.fillRect(p.x - w/2, p.y - h, w, h);
                    }
                    ctx.restore();
                }
            });

            if (state === "GAMEOVER" && isNewHighScore) {
                particles.forEach(p => {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.fillStyle = "#00ff88";
                    ctx.shadowColor = "#ffff00";
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#ffff00";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.restore();
                });
            }
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            initAudio();

            const input = document.getElementById("player-name").value.trim();
            if (input) playerName = input;

            level = 1;
            speed = baseSpeed;
            totalScore = 0;
            frameCount = 0;
            levelTimeSeconds = 0;
            totalTimeSeconds = 0;
            isNewHighScore = false;

            spawnedDiamondThisLevel = false;
            spawnedAdvanceThisLevel = false;

            player.lane = 2; // Start in center lane of 5
            player.x = LANES_X[2];
            player.z = PLAYER_MIN_Z;
            player.targetZ = PLAYER_MIN_Z;
            player.yOffset = 0;
            player.isJumping = false;
            player.isSliding = false;

            obstacles = [];
            collectibles = [];
            particles = [];

            document.getElementById("hud-level").innerText = level;
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("gameover-screen").classList.add("hidden");
            document.getElementById("congrats-msg").classList.add("hidden");
            state = "RUNNING";
        }

        function togglePause() {
            if (state === "RUNNING") {
                state = "PAUSED";
                document.getElementById("pause-screen").classList.remove("hidden");
            } else if (state === "PAUSED") {
                state = "RUNNING";
                document.getElementById("pause-screen").classList.add("hidden");
            }
        }

        function triggerGameOver() {
            state = "GAMEOVER";
            playSound("crash");

            const congratsEl = document.getElementById("congrats-msg");

            if (totalScore > highScore) {
                highScore = totalScore;
                isNewHighScore = true;
                congratsEl.classList.remove("hidden");
                createCoinShower();
                playSound("bonus");
            } else {
                congratsEl.classList.add("hidden");
            }

            document.getElementById("final-score").innerText = totalScore;
            document.getElementById("high-score").innerText = highScore;
            document.getElementById("final-level").innerText = level;
            document.getElementById("gameover-screen").classList.remove("hidden");

            fetch("/api/scores", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: playerName, score: totalScore })
            }).catch(() => {});
        }

        function fetchInitialHighScore() {
            fetch("/api/scores")
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        highScore = data[0].score;
                    }
                })
                .catch(() => {});
        }

        document.getElementById("start-btn").addEventListener("click", startGame);
        document.getElementById("restart-btn").addEventListener("click", startGame);
        document.getElementById("resume-btn").addEventListener("click", togglePause);

        document.getElementById("player-name").addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                startGame();
            }
        });

        fetchInitialHighScore();
        gameLoop();
    </script>
</body>
</html>
